<!-- [APP PASSWORD LOCK] - hide the application until the correct password is entered -->
<script>
(() => {
    "use strict";
    const use_lock = true;
    const lock_password = "password123";
    if (!use_lock) return;

    // Hide all application content before it renders
    const root = document.documentElement;
    root.classList.add("ps-password-locked");
    const style = document.createElement("style");
    style.textContent = `
        html.ps-password-locked,html.ps-password-locked body{overflow:hidden!important}
        html.ps-password-locked body>:not(#psPasswordGate){visibility:hidden!important}
        #psPasswordGate{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px;background:#f7f8f7;font-family:Manrope,system-ui,sans-serif;color:#26303c}
        #psPasswordGate .ps-lock-card{width:min(390px,100%);padding:32px;background:#fff;border:1px solid #e2e5e4;border-radius:16px;box-shadow:0 12px 40px #26303c12;text-align:center}
        #psPasswordGate .ps-lock-icon{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 18px;border-radius:14px;background:#26303c;color:#ecb36d}
        #psPasswordGate .ps-lock-icon svg{width:27px;height:27px}
        #psPasswordGate h2{margin:0 0 6px;font-size:21px;font-weight:800}
        #psPasswordGate p{margin:0 0 24px;color:#697077;font-size:12px}
        #psPasswordGate input{display:block;width:100%;height:44px;padding:0 13px;border:1px solid #cdd2d2;border-radius:8px;background:#fff;color:#26303c;font:inherit;font-size:14px;outline:none}
        #psPasswordGate input:focus{border-color:#ecb36d;box-shadow:0 0 0 3px #ecb36d30}
        #psPasswordGate button{width:100%;height:44px;margin-top:12px;border:0;border-radius:8px;background:#26303c;color:#fff;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
        #psPasswordGate button:hover{background:#3b4a5a}
        #psPasswordGate .ps-lock-error{min-height:18px;margin:10px 0 0;color:#a53746;font-size:11px;font-weight:700}
    `;
    document.head.append(style);

    // Create the password screen
    function showLock() {
        const gate = document.createElement("div");
        gate.id = "psPasswordGate";
        gate.setAttribute("role", "dialog");
        gate.setAttribute("aria-modal", "true");
        gate.setAttribute("aria-labelledby", "psLockTitle");
        gate.innerHTML = `
            <form class="ps-lock-card">
                <div class="ps-lock-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
                <h2 id="psLockTitle">Package Scout</h2>
                <p>Enter your password to continue</p>
                <input type="password" placeholder="Password" aria-label="Application password" autocomplete="off" required>
                <button type="submit">Unlock</button>
                <div class="ps-lock-error" role="status" aria-live="polite"></div>
            </form>
        `;
        document.body.append(gate);
        const form = gate.querySelector("form"), input = gate.querySelector("input"), error = gate.querySelector(".ps-lock-error");

        // Validate password and restore the application
        form.addEventListener("submit", event => {
            event.preventDefault();
            if (input.value !== lock_password) {error.textContent = "Incorrect password. Please try again."; input.value = ""; input.focus(); return;}
            root.classList.remove("ps-password-locked");
            gate.remove();
            style.remove();
        });
        input.focus();
    }

    // Initialise when the document body is available
    if (document.body) showLock();
    else document.addEventListener("DOMContentLoaded", showLock, {once: true});
})();
</script>

<!-- Block 1 — Offer crawler -->
<script>
(() => {
    "use strict";
    const P = window.PACKAGE_SCOUT ||= {};
    const endpoint = "https://gateway.travelsupermarket.com/best-of-search/v2/offers";
    const airports = [{code: "LHR", name: "Heathrow"}, {code: "LGW", name: "Gatwick"}, {code: "MAN", name: "Manchester"}, {code: "STN", name: "Stansted"}, {code: "LTN", name: "Luton"}, {code: "BHX", name: "Birmingham"}, {code: "BRS", name: "Bristol"}];
    const pageSize = 100, concurrency = 12, retryable = new Set([408, 429, 500, 502, 503, 504]);
    const iso = date => date.toISOString().slice(0, 10);
    const dateAt = value => new Date(`${value}T00:00:00Z`);
    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
    const dateFormat = new Intl.DateTimeFormat("en-GB", {timeZone: "Europe/London", year: "numeric", month: "2-digit", day: "2-digit"});

    // Use London calendar dates and split the rolling year into calendar months.
    P.allDateRange = () => {
        const parts = Object.fromEntries(dateFormat.formatToParts().map(({type, value}) => [type, value]));
        const year = Number(parts.year), month = Number(parts.month), day = Number(parts.day);
        const lastDay = new Date(Date.UTC(year + 1, month, 0)).getUTCDate();
        return {from: `${parts.year}-${parts.month}-${parts.day}`, to: iso(new Date(Date.UTC(year + 1, month - 1, Math.min(day, lastDay) - 1)))};
    };
    function windows({from, to}) {
        const result = [];
        for (let start = dateAt(from); iso(start) <= to;) {
            const next = new Date(Date.UTC(start.getUTCFullYear(), start.getUTCMonth() + 1, 1));
            const monthEnd = iso(new Date(next.getTime() - 86400000));
            result.push({from: iso(start), to: monthEnd < to ? monthEnd : to});
            start = next;
        }
        return result;
    }

    // Fetch one Anywhere page with the structured destination hierarchy.
    async function page(config, airport, dates, offset) {
        const url = new URL(endpoint);
        url.search = new URLSearchParams({limit: pageSize, offset, sort: "price", simple: "false", dedupeHotels: "false", trigger: "bos-month-results", departureAirport: `:${airport.code}`, duration: `:${config.nights}`, adults: `${config.adults}:`, children: `${config.children}:`, infants: `${config.infants}:`, starRating: `:${config.ratings.join(",")}`, minDepartureDate: `${dates.from}:`, maxDepartureDate: `${dates.to}:`});
        for (let attempt = 0; attempt < 3; attempt++) {
            let response;
            try {
                const options = {credentials: "omit", signal: AbortSignal.timeout(20000)};
                response = await (P.fetchOfferPage ? P.fetchOfferPage(url.href, options) : fetch(url.href, options));
            } catch (error) {
                if (attempt === 2) throw new Error(`${airport.code} · page ${offset / pageSize + 1}: ${error.message}. Check browser access to the offers API.`);
                await sleep(1000 * 2 ** attempt);
                continue;
            }
            if (response.ok) {
                const data = await response.json().catch(() => null);
                if (!data || !Number.isSafeInteger(data.total) || data.total < 0 || !Array.isArray(data.offers)) throw new Error(`${airport.code} returned an invalid offers response.`);
                return data;
            }
            if (!retryable.has(response.status) || attempt === 2) throw new Error(`${airport.code} · page ${offset / pageSize + 1}: HTTP ${response.status}.`);
            const retryAfter = response.headers.get("Retry-After");
            const delay = retryAfter === null ? 0 : /^\d+$/.test(retryAfter) ? Number(retryAfter) * 1000 : Date.parse(retryAfter) - Date.now();
            await sleep(Math.max(1000 * 2 ** attempt, Number.isFinite(delay) ? delay : 0));
        }
    }

    // Verify each page and keep only cleaned rows for the airport-month batch.
    async function crawlBatch(party, airport, dates, ratings, sanitise) {
        const first = await page(party, airport, dates, 0), total = first.total, unique = new Map();
        function accept(data, offset) {
            if (data.total !== total || data.offers.length !== Math.min(pageSize, total - offset)) throw new Error(`${airport.code}: results changed during paging. Please search again.`);
            for (const offer of data.offers) {
                if (typeof offer?.uuid !== "string" || !offer.uuid.trim()) throw new Error(`${airport.code} returned an offer without an ID.`);
                if (Number(offer.adults) !== party.adults || Number(offer.children) !== party.children || Number(offer.infants) !== party.infants) throw new Error(`${airport.code} returned an offer for a different party.`);
                if (!ratings.has(Number(offer.hotel?.starRating))) throw new Error(`${airport.code} returned an offer outside the selected hotel ratings.`);
                unique.set(offer.uuid, sanitise(offer, airport.name));
            }
        }
        accept(first, 0);
        let nextOffset = pageSize, failure;
        await Promise.all(Array.from({length: Math.min(concurrency, Math.max(0, Math.ceil(total / pageSize) - 1))}, async () => {
            while (!failure && nextOffset < total) {
                const offset = nextOffset;
                nextOffset += pageSize;
                try { accept(await page(party, airport, dates, offset), offset); } catch (error) { failure ||= error; }
            }
        }));
        if (failure) throw failure;
        if (unique.size !== total) throw new Error(`${airport.code}: received ${unique.size} unique offers of ${total}. Please search again.`);
        return unique;
    }

    // Deduplicate across completed batches and discard UUIDs at the end.
    P.crawlOffers = async (config, onProgress = () => {}) => {
        const sanitise = P.sanitiseOffer;
        if (typeof sanitise !== "function") throw new Error("Block 1A is required to prepare the offers table.");
        if (!Array.isArray(config.ratings) || !config.ratings.includes(5) || config.ratings.some(rating => rating !== 4 && rating !== 5)) throw new Error("Select 5★ only or 4★ and 5★.");
        const party = {...config, children: config.children ?? 0, infants: config.infants ?? 0, ratings: [...new Set(config.ratings)]};
        if (![party.nights, party.adults].every(value => Number.isSafeInteger(value) && value >= 1) || ![party.children, party.infants].every(value => Number.isSafeInteger(value) && value >= 0)) throw new Error("Enter valid nights and traveller counts.");
        const offers = [], seen = new Set(), ratings = new Set(party.ratings);
        const months = windows(P.allDateRange()), total = months.length * airports.length;
        let completed = 0;
        for (const dates of months) {
            for (const airport of airports) {
                onProgress(`Searching ${airport.name} · ${dates.from} to ${dates.to}`, {completed, total});
                const batch = await crawlBatch(party, airport, dates, ratings, sanitise);
                for (const [uuid, offer] of batch) {
                    if (seen.has(uuid)) continue;
                    offers.push(offer);
                    seen.add(uuid);
                }
                completed++;
                onProgress(`${airport.name} complete · ${completed} of ${total} airport-month searches`, {completed, total});
            }
        }
        return {complete: true, offers};
    };
})();
</script>
<!-- Block 1A — Clean offer rows -->
<script>
(() => {
    "use strict";
    const P = window.PACKAGE_SCOUT ||= {};
    const boards = new Map([["AI", "All Inclusive"], ["FB", "Full Board"], ["HB", "Half Board"], ["BB", "Bed & Breakfast"], ["SC", "Self-catering"], ["RO", "Room Only"]]);
    const site = "https://www.travelsupermarket.com";
    const text = value => typeof value === "string" ? value.trim() || null : null;
    const normal = value => (text(value) || "").normalize("NFKD").replace(/\p{M}/gu, "").replace(/[’']/g, "").replace(/\s+/g, " ").toLowerCase();
    const number = value => typeof value === "number" || text(value) !== null ? Number(value) : NaN;
    const integer = (value, min = 0) => { const n = number(value); return Number.isSafeInteger(n) && n >= min ? n : null; };
    const coordinate = (value, max) => { const n = number(value); return Number.isFinite(n) && Math.abs(n) <= max ? n : null; };
    const reviewScore = value => { const n = number(value); return Number.isFinite(n) && n > 0 && n <= 10 ? n : null; };
    const idOf = value => typeof value === "number" && Number.isSafeInteger(value) ? String(value) : text(value);
    const partsOf = value => (text(value) || "").split(",").map(text).filter(Boolean);
    const regionNames = new Intl.DisplayNames(["en-GB"], {type: "region", fallback: "none"});
    const codes = "AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS XK YE YT ZA ZM ZW".split(" ");
    const codeAliases = new Map([["FX", "FR"], ["UK", "GB"]]);
    const displayOverrides = new Map([["CV", "Cape Verde"], ["TR", "Turkey"], ["CZ", "Czech Republic"], ["XK", "Kosovo"]]);
    const countries = new Map(), countryNames = new Map();

    // Index canonical country codes and exact names.
    for (const countryCode of codes) {
        const display = regionNames.of(countryCode), country = displayOverrides.get(countryCode) || display;
        if (!country) continue;
        const entry = Object.freeze({country, countryCode});
        countries.set(countryCode, entry);
        countryNames.set(normal(country), entry);
        if (display) countryNames.set(normal(display), entry);
    }
    for (const [name, code] of Object.entries({"metropolitan france": "FR", "cape verde": "CV", "cabo verde": "CV", "turkiye": "TR", "czechia": "CZ", "usa": "US", "united states of america": "US", "uae": "AE", "ivory coast": "CI"})) countryNames.set(name, countries.get(code));
    const countryOf = value => countryNames.get(normal(value)) ?? null;
    function resolveCountry(value) {
        const code = text(value)?.toUpperCase();
        return countries.get(codeAliases.get(code) || code) ?? countryOf(value);
    }
    P.resolveCountry = resolveCountry;

    // Validate calendar dates and HTTPS links.
    function date(value) {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        const parsed = new Date(`${value}T00:00:00Z`);
        return Number.isFinite(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value ? value : null;
    }
    function dealUrl(value) {
        const link = text(value);
        if (!link) return null;
        try {
            const url = new URL(link, site);
            return url.protocol === "https:" && !url.username && !url.password ? url.href : null;
        } catch { return null; }
    }

    // Build the operator handoff from the crawled offer and operator IDs.
    function bookingUrl(raw) {
        const offerUuid = text(raw.uuid), partnerId = idOf(raw.brandId);
        if (!offerUuid || !/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(offerUuid) || !partnerId || !/^[1-9]\d*$/.test(partnerId)) return null;
        const url = new URL("/en-gb/v2/bos/interstitial", site);
        url.search = new URLSearchParams({offerUuid, partnerId}).toString();
        return url.href;
    }

    // Follow the hotel's destination ID through linked provider nodes.
    function destinationPath(hotel, searchDestination) {
        const hotelNodes = Array.isArray(hotel?.destination) ? hotel.destination : [];
        const searchNodes = Array.isArray(searchDestination) ? searchDestination : [];
        const byId = new Map();
        for (const entries of [searchNodes, hotelNodes]) {
            for (const entry of entries) {
                const id = idOf(entry?.id);
                if (id !== null) byId.set(id, entry);
            }
        }
        const path = [], visited = new Set();
        for (let id = idOf(hotel?.destinationId); id !== null && !visited.has(id);) {
            const entry = byId.get(id);
            if (!entry) break;
            path.push(entry);
            if (entry.type === "COUNTRY") break;
            visited.add(id);
            id = idOf(entry.parentId);
        }
        return path;
    }

    const aliases = {AE: ["United Arab Emirates", "UAE"], US: ["USA", "United States", "United States of America", "America"], TR: ["Turkey", "Türkiye"], CZ: ["Czechia", "Czech Republic"], CI: ["Côte d’Ivoire", "Ivory Coast"], CV: ["Cape Verde", "Cabo Verde"], KR: ["South Korea", "Republic of Korea"], KP: ["North Korea"], RU: ["Russia", "Russian Federation"], VN: ["Vietnam", "Viet Nam"], TL: ["East Timor", "Timor-Leste"], CD: ["Democratic Republic of the Congo", "DR Congo", "Congo-Kinshasa"], CG: ["Republic of the Congo", "Congo-Brazzaville"], PS: ["Palestinian Territories", "Occupied Palestinian Territories", "Palestine"], TZ: ["Tanzania", "United Republic of Tanzania"]};
    const labels = {all: "FCDO advises against all travel", essential: "FCDO advises against all but essential travel", parts: "FCDO advises against all travel to parts", "parts-essential": "FCDO advises against all but essential travel to parts", mixed: "Essential travel only in some areas and no travel in others. See GOV.UK for details", safe: "No FCDO advice against travel", unknown: "FCDO warning status unavailable"};
    const records = new Map(), queued = new Set(), failures = new Map();
    let countries = new Map(), indexPromise = null, indexExpiresAt = 0, requestQueue = Promise.resolve(), lastRequest = 0, blockedUntil = 0;

    // Read and write the browser cache independently of offers storage.
    function read(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
    function write(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} }
    const fresh = record => Number.isFinite(record?.fetchedAt) && Date.now() - record.fetchedAt < ADVICE_TTL;
    const savedRecords = read(CACHE_KEY, []);
    if (Array.isArray(savedRecords)) for (const item of savedRecords) { if (Array.isArray(item) && typeof item[0] === "string" && Number.isFinite(item[1]?.fetchedAt)) records.set(item[0], item[1]); }

    // Resolve ISO codes and exact country names independently of the offer schema.
    const normal = value => String(value ?? "").normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    const aliasCodes = new Map(Object.entries(aliases).flatMap(([code, names]) => names.map(name => [normal(name), code])));
    function identify(value) {
        const input = typeof value === "string" ? {country: value} : value;
        const raw = String(input?.countryName || input?.country || input?.name || "").trim();
        const suppliedCode = String(input?.countryCode || input?.code || "").trim().toUpperCase();
        const name = /^[a-z]{2}$/i.test(raw) ? "" : raw;
        const code = /^[A-Z]{2}$/.test(suppliedCode) ? suppliedCode : name ? aliasCodes.get(normal(name)) || "" : /^[a-z]{2}$/i.test(raw) ? raw.toUpperCase() : "";
        if (!code && !normal(name)) return null;
        return {key: code || `name:${normal(name)}`, code, name: name || displayNames.of(code) || code};
    }
    function entryFor(rows, target) {
        const names = new Set([target.name, target.code ? displayNames.of(target.code) : "", ...(aliases[target.code] || [])].map(normal).filter(Boolean));
        const official = rows.filter(row => names.has(normal(row.name)));
        if (official.length === 1) return official[0];
        if (official.length > 1) return null;
        const matches = rows.filter(row => [row.slug, ...row.synonyms].some(name => names.has(normal(name))));
        return matches.length === 1 ? matches[0] : null;
    }

    // Fetch public GOV.UK content through the existing CORS proxy.
    async function fetchJSON(url) {
        const wait = Math.max(0, lastRequest + GAP - Date.now());
        if (wait) await new Promise(resolve => setTimeout(resolve, wait));
        lastRequest = Date.now();
        const response = await fetch(`https://cors.tools/proxy?url=${encodeURIComponent(url)}`, {credentials: "omit", signal: AbortSignal.timeout(25000)});
        if (!response.ok) throw Object.assign(new Error(`FCDO HTTP ${response.status}`), {status: response.status});
        return response.json();
    }
    function index() {
        if (indexPromise && Date.now() < indexExpiresAt) return indexPromise;
        const saved = read(INDEX_KEY, null);
        const cached = Array.isArray(saved?.rows) && saved.rows.length >= 100 ? saved : null;
        if (cached && Date.now() - cached.time < INDEX_TTL) {
            indexExpiresAt = cached.time + INDEX_TTL;
            return indexPromise = Promise.resolve(cached.rows);
        }
        indexExpiresAt = Infinity;
        indexPromise = (async () => {
            try {
                const data = await fetchJSON(BASE);
                const rows = (data.links?.children || []).filter(item => item.document_type === "travel_advice").map(item => {
                    const country = item.details?.country;
                    return {name: country?.name || item.title?.replace(/ travel advice$/i, "") || "", slug: country?.slug || item.base_path?.split("/").pop() || "", synonyms: Array.isArray(country?.synonyms) ? country.synonyms : [], updatedAt: item.public_updated_at || ""};
                }).filter(item => item.name && /^[a-z0-9-]+$/.test(item.slug));
                if (rows.length < 100) throw new Error("Incomplete FCDO travel advice index");
                const time = Date.now();
                write(INDEX_KEY, {time, rows});
                indexExpiresAt = time + INDEX_TTL;
                return rows;
            } catch (error) {
                indexExpiresAt = cached ? Date.now() + RETRY : 0;
                if (cached) return cached.rows;
                indexPromise = null;
                throw error;
            }
        })();
        return indexPromise;
    }

    // Preserve the distinction between countrywide and regional advisories.
    function classify(alerts) {
        const flags = new Set(alerts);
        if (flags.has("avoid_all_travel")) return "all";
        if (flags.has("avoid_all_travel_to_parts") && (flags.has("avoid_all_but_essential_travel") || flags.has("avoid_all_but_essential_travel_to_parts"))) return "mixed";
        if (flags.has("avoid_all_but_essential_travel")) return "essential";
        if (flags.has("avoid_all_travel_to_parts")) return "parts";
        if (flags.has("avoid_all_but_essential_travel_to_parts")) return "parts-essential";
        return flags.size ? "unknown" : "safe";
    }
    function peek(value) {
        const target = identify(value), record = target && records.get(target.key);
        if (!record) return null;
        const {status} = record, stale = !fresh(record), regional = ["parts", "parts-essential", "mixed"].includes(status);
        const label = labels[status] || labels.unknown;
        const note = regional ? "Check the GOV.UK advice to see which areas are affected." : "See the full GOV.UK travel advice for details.";
        return {...record, stale, regional, isWarning: ["all", "essential", "parts", "parts-essential", "mixed"].includes(status), label, note, tooltip: `${label}. ${note}${stale ? " Cached advice may be outdated." : ""}`};
    }
    const emit = (target, state) => document.dispatchEvent(new CustomEvent("package-scout:travel-advice-changed", {detail: {key: target.key, code: target.code, state, pending: queued.size}}));

    // Queue stale or missing country advice and reuse cached data during refresh.
    function enqueue(target) {
        if (!target || queued.has(target.key) || fresh(records.get(target.key)) || (failures.get(target.key) || 0) > Date.now() || blockedUntil > Date.now()) return;
        queued.add(target.key);
        emit(target, "loading");
        requestQueue = requestQueue.then(async () => {
            try {
                if (blockedUntil > Date.now()) { emit(target, "unavailable"); return; }
                const entry = entryFor(await index(), target);
                if (!entry) throw new Error(`No exact FCDO country match for ${target.name}`);
                const data = await fetchJSON(`${BASE}/${entry.slug}`), alerts = data.details?.alert_status;
                if (data.document_type !== "travel_advice" || !Array.isArray(alerts)) throw new Error("FCDO response is missing its warning status");
                records.set(target.key, {status: classify(alerts), alerts, country: entry.name, url: `https://www.gov.uk/foreign-travel-advice/${entry.slug}`, updatedAt: data.public_updated_at || entry.updatedAt || "", changeDescription: String(data.details?.change_description || "").replace(/\s+/g, " ").trim().slice(0, 300), fetchedAt: Date.now()});
                failures.delete(target.key);
                write(CACHE_KEY, [...records]);
                emit(target, "updated");
            } catch (error) {
                failures.set(target.key, Date.now() + RETRY);
                if (error.status === 429 || error.status >= 500 || error.name === "TimeoutError" || error instanceof TypeError) blockedUntil = Date.now() + RETRY;
                emit(target, "unavailable");
            } finally {
                queued.delete(target.key);
                emit(target, "settled");
            }
        });
    }

    // Retain distinct countries from the latest published offers.
    function sync(offers) {
        if (Array.isArray(offers)) {
            const inputs = new Set();
            countries = new Map();
            for (const offer of offers) {
                const input = offer?.countryCode || offer?.countryName || offer?.country;
                if (!input || inputs.has(input)) continue;
                inputs.add(input);
                const target = identify(offer);
                if (target) countries.set(target.key, target);
            }
        }
        for (const target of countries.values()) enqueue(target);
        return countries.size;
    }
    function ensure(value) { enqueue(identify(value)); return peek(value); }
    function retry() { blockedUntil = 0; failures.clear(); indexExpiresAt = 0; return sync(); }
    P.travelAdvice = {peek, get: peek, ensure, sync, retry, identify, labels, source: BASE, get pending() { return queued.size; }, get blockedUntil() { return blockedUntil; }};
    document.addEventListener("package-scout:search-complete", event => { if (Array.isArray(event.detail?.offers)) sync(event.detail.offers); });
})();
</script>

    function updateOfferCount() {

                updateProgress(counts.completed, counts.total);
            });

        } catch (error) {
            console.error("Package Scout search failed:", error);
            setState("idle", "Couldn’t complete the search. Please try again.");
        }
    });
})();

                    if (!response.ok) throw new Error(`Calendar request returned HTTP ${response.status}.`);
                    const records = extract(await response.json()).map(compact), councils = install(records);
                    try { localStorage.setItem(cacheKey, JSON.stringify({saved: Date.now(), records})); } catch {}
                    return {councils, stale: false};
                } catch (error) { lastError = error; }
            }
            if (cached) return {councils: cached, stale: true};
            throw lastError || new Error("Council calendars are unavailable.");
        })().catch(error => { calendarRequest = null; throw error; });
        return calendarRequest;
    }

    // Keep the existing term-gap and weekend rules for school breaks.
    function holidayPeriods(item) {
        if (!item || !availableMonths.size) return [];
        const events = item.events.slice().sort((a, b) => a.start.localeCompare(b.start)), spans = [];
        function push(start, end) {
            const days = daysBetween(start, end);
            if (days >= 3 && days <= 80) spans.push({start, end});
        }
        for (const event of events) {
            if (event.type === "term_end") {
                const next = events.find(entry => entry.type === "term_start" && entry.start > event.start);
                if (next) {
                    const start = addDays(event.start, 1), end = addDays(next.start, -1), days = daysBetween(start, end);
                    if (days <= 25 || (days <= 75 && [6, 7, 8].includes(Number(start.slice(5, 7))))) push(start, end);
                }
            }
            if (["half_term_start", "half_term", "holiday"].includes(event.type) && event.end >= event.start) {
                let {start, end} = event;
                const first = dateAt(start).getUTCDay(), last = dateAt(end).getUTCDay();
                if (first === 1) start = addDays(start, -2);
                else if (first === 5 && last === 1) start = addDays(start, 1);
                if (last === 5) end = addDays(end, 2);
                else if (last === 1 && daysBetween(event.start, event.end) >= 7) end = addDays(end, -1);
                push(start, end);
            }
        }
        const merged = [];
        for (const span of spans.sort((a, b) => a.start.localeCompare(b.start))) {
            const previous = merged.at(-1);
            if (!previous || span.start > addDays(previous.end, 1)) merged.push(span);
            else if (span.end > previous.end) previous.end = span.end;
        }
        const names = {1: "Christmas", 2: "February half term", 3: "Easter", 4: "Easter", 5: "May half term", 7: "Summer", 8: "Summer", 10: "October half term", 11: "October half term", 12: "Christmas"};
        return merged.filter(span => [...availableMonths].some(month => month >= span.start.slice(0, 7) && month <= span.end.slice(0, 7))).map(span => {
            const month = Number(span.start.slice(5, 7));
            const name = month === 6 ? daysBetween(span.start, span.end) < 23 ? "May half term" : "Summer" : names[month] || dateAt(span.start).toLocaleDateString("en-GB", {month: "long", timeZone: "UTC"});
            return {...span, name: `${name} ${span.start.slice(0, 4)}`};
        });
    }

    // Put council search beside the date modes and holiday periods below.
    function drawSchool() {
        councilSlot.replaceChildren();
        school.replaceChildren();
        const status = node("p", "pst-status");
        status.setAttribute("role", "status");
        if (!calendar) {
            status.textContent = calendarError ? "Couldn’t load council dates." : "Loading council dates…";
            school.append(status);
            if (calendarError) school.append(button("Retry", requestCalendar));
            return;
        }
        const input = node("input"), popup = node("div", "pst-council-list"), periods = group("School holiday periods");
        input.type = "search";
        input.value = council?.name || "";
        input.placeholder = "Search or choose a council";
        input.autocomplete = "off";
        input.setAttribute("role", "combobox");
        input.setAttribute("aria-label", "Council");
        input.setAttribute("aria-autocomplete", "list");
        input.setAttribute("aria-expanded", "false");
        popup.id = "pstCouncilOptions";
        popup.hidden = true;
        popup.setAttribute("role", "listbox");
        popup.setAttribute("aria-label", "Councils");
        input.setAttribute("aria-controls", popup.id);
        let matches = [], active = -1;
        function close() {
            popup.hidden = true;
            input.value = council?.name || "";
            input.setAttribute("aria-expanded", "false");
            input.removeAttribute("aria-activedescendant");
        }
        function drawPeriods() {
            const choices = holidayPeriods(council);
            periods.replaceChildren();
            for (const item of choices) {
                const dates = `${dayFormat.format(dateAt(item.start))} – ${dayFormat.format(dateAt(item.end))}`;
                const pressed = period?.start === item.start && period?.end === item.end;
                periods.append(button(`${item.name} · ${dates}`, event => {
                    const clicked = event.currentTarget;
                    period = clicked.getAttribute("aria-pressed") === "true" ? null : item;
                    for (const control of periods.children) control.setAttribute("aria-pressed", String(Boolean(period) && control === clicked));
                    updateStatus();
                }, pressed, true));
            }
            periods.hidden = !choices.length;
            updateStatus();
            function updateStatus() {
                const message = !council ? "" : !choices.length ? "No school holiday dates for these travel months." : !period ? "Select a holiday period." : "";
                status.textContent = [message, calendar.stale ? "Showing cached council dates." : ""].filter(Boolean).join(" ");
            }
        }
        function choose(item) {
            if (!item) return;
            if (council?.slug !== item.slug) period = null;
            council = item;
            close();
            drawPeriods();
        }
        function open(query) {
            const term = normal(query);
            matches = calendar.councils.filter(item => normal(item.name).includes(term));
            active = -1;
            popup.replaceChildren();
            input.removeAttribute("aria-activedescendant");
            matches.forEach((item, index) => {
                const option = node("div", "", item.name);
                option.id = `${popup.id}-${index}`;
                option.setAttribute("role", "option");
                option.setAttribute("aria-selected", "false");
                option.addEventListener("mousedown", event => event.preventDefault());
                option.addEventListener("click", () => choose(item));
                popup.append(option);
            });
            if (!matches.length) popup.append(node("p", "pst-status", "No matching councils."));
            popup.hidden = false;
            input.setAttribute("aria-expanded", "true");
        }
        input.addEventListener("focus", () => { open(""); input.select(); });
        input.addEventListener("click", () => { if (popup.hidden) { open(""); input.select(); } });
        input.addEventListener("input", () => open(input.value));
        input.addEventListener("blur", close);
        input.addEventListener("keydown", event => {
            if (event.key === "Escape" && !popup.hidden) { event.preventDefault(); close(); return; }
            if (event.key === "Enter" && !popup.hidden) {
                event.preventDefault();
                choose(matches[active] || (matches.length === 1 ? matches[0] : null));
                return;
            }
            if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
            event.preventDefault();
            if (popup.hidden) open("");
            if (!matches.length) return;
            if (active >= 0) popup.children[active].setAttribute("aria-selected", "false");
            active = event.key === "ArrowDown" ? Math.min(matches.length - 1, active + 1) : active <= 0 ? matches.length - 1 : active - 1;
            const option = popup.children[active];
            option.setAttribute("aria-selected", "true");
            input.setAttribute("aria-activedescendant", option.id);
            option.scrollIntoView({block: "nearest"});
        });
        councilSlot.append(input, popup);
        school.append(periods, status);
        drawPeriods();
    }
    async function requestCalendar() {
        if (calendar || calendarLoading) return;
        calendarLoading = true;
        calendarError = false;
        drawSchool();
        try { calendar = await loadCalendar(); } catch { calendarError = true; }
        finally { calendarLoading = false; if (mode === "school") drawSchool(); }
    }
    function validateRange() {
        to.setCustomValidity(mode === "range" && from.value && to.value && from.value > to.value ? "Depart by must be on or after Depart from." : "");
    }
    function setMode(next) {
        mode = next;
        for (const [key, control] of modeButtons) control.setAttribute("aria-pressed", String(key === mode));
        months.element.hidden = mode !== "months";
        range.hidden = from.disabled = to.disabled = mode !== "range";
        councilSlot.hidden = school.hidden = mode !== "school";
        validateRange();
        if (mode === "school") {
            if (calendar || calendarLoading || calendarError) drawSchool();
            else void requestCalendar();
        }
    }
    from.addEventListener("input", validateRange);
    to.addEventListener("input", validateRange);
    setMode("months");

    // Capture a stable predicate for the shared Search submission.
    function snapshot() {
        const dateMode = mode, departureMonths = months.snapshot(), departureAirports = airports.snapshot(), boardTypes = boards.snapshot();
        const start = from.value, end = to.value, holiday = period;
        return offer => {
            const departure = offer.departureDate;
            if (dateMode === "months" && departureMonths && !departureMonths.has(departure?.slice(0, 7))) return false;
            if (dateMode === "range" && (start || end) && (!departure || (start && departure < start) || (end && departure > end))) return false;
            if (dateMode === "school" && holiday) {
                if (!departure || departure < holiday.start || departure > holiday.end) return false;
                const checkout = offer.returnDate || (Number.isSafeInteger(offer.nights) && offer.nights > 0 && validDate(departure) ? addDays(departure, offer.nights) : "");
                if (!checkout || checkout <= departure || checkout > holiday.end) return false;
            }
            if (departureAirports && !departureAirports.has(airportKey(offer.departureAirport))) return false;
            if (boardTypes && !boardTypes.has(normal(offer.board))) return false;
            return true;
        };
    }
    P.travelFilters = {matches: offer => applied(offer)};
    root.addEventListener("package-scout:filters-submit", event => {
        const submitted = snapshot();
        event.detail.matches = submitted;
        queueMicrotask(() => { if (!event.defaultPrevented) applied = submitted; });
    });

    // Keep draft selections and extend the choices for newly returned data.
    root.addEventListener("package-scout:search-complete", event => {
        const offers = event.detail?.offers;
        if (!Array.isArray(offers) || !offers.length) return;
        const extraMonths = new Set(), extraAirports = new Map(), extraBoards = new Map();
        for (const offer of offers) {
            const departure = offer.departureDate;
            if (validDate(departure)) extraMonths.add(departure.slice(0, 7));
            if (offer.departureAirport && !extraAirports.has(offer.departureAirport)) extraAirports.set(offer.departureAirport, airportKey(offer.departureAirport));
            if (offer.board && !extraBoards.has(offer.board)) extraBoards.set(offer.board, normal(offer.board));
        }
        for (const key of [...extraMonths].sort()) {
            availableMonths.add(key);
            months.add(key, monthFormat.format(dateAt(`${key}-01`)));
        }
        for (const [value, key] of extraAirports) airports.add(key, value);
        for (const [value, key] of extraBoards) boards.add(key, value);
        if (mode === "school" && calendar) drawSchool();
    });
})();
</script>

<script>
(() => {
    "use strict";
    const P = window.PACKAGE_SCOUT ||= {}, filters = P.explorerFilters ||= {};
    if (filters.destinations) return;
    const number = new Intl.NumberFormat("en-GB"), money = new Intl.NumberFormat("en-GB", {style: "currency", currency: "GBP", maximumFractionDigits: 0});
    const normal = value => String(value ?? "").normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
    function node(tag, className = "", text = "") { const element = document.createElement(tag); element.className = className; element.textContent = text; return element; }

    // Prefer bundled flag images and use a globe when no flag is available.
    function flag(code) {
        const holder = node("span", "psx-country-flag");
        holder.setAttribute("aria-hidden", "true");
        function showGlobe() {
            holder.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>';
        }
        if (!/^[A-Z]{2}$/.test(code)) { showGlobe(); return holder; }
        const image = node("img"), filename = `${code.toLowerCase()}.svg`;
        image.alt = "";
        image.decoding = "async";
        image.referrerPolicy = "no-referrer";
        image.addEventListener("error", () => {
            image.addEventListener("error", showGlobe, {once: true});
            image.src = `https://flagcdn.com/${filename}`;
        }, {once: true});
        holder.append(image);
        image.src = `./flags/${filename}`;
        return holder;
    }

    // Show all destinations until the user selects specific countries.
    filters.destinations = ({host, change}) => {
        const selected = new Set();
        let stats = new Map(), maxCount = 0, maxPricePence = null, minTemp = null;
        const heading = node("div", "psx-dest-head"), title = node("h2", "", "Destinations"), status = node("small"), search = node("input"), clear = node("button", "", "Clear selection"), list = node("div", "psx-destination-list");
        const limits = node("div", "psx-dest-limits"), priceLabel = node("label", "", "Max price pp (£)"), tempLabel = node("label", "", "Min temp (°C)");
        const priceInput = node("input"), tempInput = node("select");
        priceInput.type = "number";
        priceInput.placeholder = "Any";
        priceInput.min = "0";
        priceInput.step = "0.01";
        tempInput.title = "Average daily high for the departure month";
        tempInput.add(new Option("Any", ""));
        for (let degrees = 10; degrees <= 40; degrees += 5) tempInput.add(new Option(`${degrees}°C`, String(degrees)));
        priceLabel.append(priceInput);
        tempLabel.append(tempInput);
        limits.append(priceLabel, tempLabel);
        search.type = "search";
        search.placeholder = "Find a destination";
        search.setAttribute("aria-label", "Find a destination");
        clear.type = "button";
        clear.hidden = true;
        heading.append(title, clear);
        host.append(heading, status, limits, search, list);

        // Apply price and temperature limits before counting destinations.
        priceInput.addEventListener("input", () => {
            if (!priceInput.validity.valid) return;
            maxPricePence = priceInput.value === "" ? null : Math.round(priceInput.valueAsNumber * 100);
            change();
        });
        tempInput.addEventListener("change", () => {
            minTemp = tempInput.value === "" ? null : Number(tempInput.value);
            change();
        });
        function matchesOffer(offer) {
            const price = offer.pricePerPersonPence;
            if (maxPricePence !== null && (!Number.isFinite(price) || price > maxPricePence)) return false;
            if (minTemp === null) return true;
            const high = P.weatherFor?.(offer)?.highC;
            return Number.isFinite(high) && high >= minTemp;
        }
        document.addEventListener("package-scout:weather-cache-updated", () => {
            if (minTemp !== null) change();
        });

        // Add advisory links independently of the country row toggle.
        function paintAdvice() {
            for (const entry of list.children) {
                const hit = entry.querySelector("button[data-country]"), line = entry.querySelector(".psx-country-name");
                if (!hit || !line) continue;
                const country = hit.dataset.countryName;
                const old = line.querySelector("a"), advice = P.travelAdvice?.peek(country);
                if (!advice?.isWarning || !advice.url?.startsWith("https://www.gov.uk/foreign-travel-advice/")) { old?.remove(); continue; }
                const link = old || node("a", "psx-country-advice", "⚠");
                link.classList.toggle("is-severe", ["all", "essential", "mixed"].includes(advice.status));
                link.href = advice.url;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.title = advice.tooltip || advice.label;
                link.setAttribute("aria-label", `${advice.label}. Open GOV.UK advice for ${country}`);
                if (!old) line.append(link);
            }
        }

        // Keep every matching destination available to select, in offer-count order.
        function draw() {
            const query = normal(search.value), fragment = document.createDocumentFragment(), scroll = list.scrollTop;
            const focused = list.contains(document.activeElement) ? document.activeElement.dataset.country : null;
            let focusTarget;
            for (const [key, {count, min, countryCode, country: countryName}] of stats) {
                const resolved = P.resolveCountry?.(countryCode) || P.resolveCountry?.(key) || P.resolveCountry?.(countryName);
                const country = countryName || resolved?.country || key, code = resolved?.countryCode || "", active = selected.has(key);
                if (query && !normal(country).includes(query) && !code.toLowerCase().includes(query)) continue;
                const entry = node("div", "psx-country-entry"), row = node("div", `psx-country${selected.size && !active ? " is-excluded" : ""}`), hit = node("button", "psx-country-hit");
                const info = node("span", "psx-country-info"), name = node("span", "psx-country-name"), price = node("span", "psx-country-price");
                const check = node("span", `psx-country-check${active ? "" : " psx-country-unchecked"}`, active ? "✓" : "");
                if (!active) { check.style.backgroundColor = "#fff"; check.style.borderColor = "#bfcac2"; }
                row.style.setProperty("--psx-country-bar", `${maxCount > 0 ? 100 * count / maxCount : 0}%`);
                hit.type = "button";
                hit.dataset.country = key;
                hit.dataset.countryName = country;
                hit.setAttribute("aria-pressed", String(active));
                hit.setAttribute("aria-label", country);
                name.append(node("strong", "", country));
                info.append(name, node("small", "", `${number.format(count)} ${count === 1 ? "offer" : "offers"}`));
                if (min === null) price.append(node("strong", "", "—")); else price.append(node("small", "", "from"), node("strong", "", money.format(min / 100)));
                row.append(check, flag(code), info, price, node("span", "psx-country-chevron", "›"));
                entry.append(row, hit);
                if (key === focused) focusTarget = hit;
                fragment.append(entry);
            }
            if (!fragment.childNodes.length) fragment.append(node("div", "psx-country-empty", stats.size ? "No destinations match your search" : "No destinations match these filters"));
            list.replaceChildren(fragment);
            status.textContent = selected.size ? `${number.format(selected.size)} ${selected.size === 1 ? "destination" : "destinations"} selected` : `All ${number.format(stats.size)} destinations included`;
            clear.hidden = selected.size === 0;
            paintAdvice();
            focusTarget?.focus({preventScroll: true});
            list.scrollTop = scroll;
        }
        search.addEventListener("input", draw);
        clear.addEventListener("click", () => { selected.clear(); search.focus(); change(); });
        list.addEventListener("click", event => {
            const country = event.target.closest("button[data-country]")?.dataset.country;
            if (!country) return;
            if (!selected.delete(country)) selected.add(country);
            change();
        });
        let adviceFrame = 0;
        document.addEventListener("package-scout:travel-advice-changed", () => {
            if (!adviceFrame) adviceFrame = requestAnimationFrame(() => { adviceFrame = 0; paintAdvice(); });
        });
        return {
            matches: country => selected.size === 0 || selected.has(country),
            matchesOffer,
            update(next) {
                const entries = [...next].sort(([a, x], [b, y]) => y.count - x.count || (x.country || a).localeCompare(y.country || b, "en-GB"));
                stats = new Map(entries);
                maxCount = entries[0]?.[1].count ?? 0;
                draw();
            },
            reset() {
                selected.clear();
                search.value = priceInput.value = tempInput.value = "";
                maxPricePence = minTemp = null;
            }
        };
    };
})();
</script>

<script>
(() => {
    "use strict";
    const P = window.PACKAGE_SCOUT ||= {};
    if (P.holidayExplorer) return;
    const filters = P.explorerFilters, consoleRoot = document.getElementById("searchConsole"), engine = P.comparisonEngine;
    if (!consoleRoot || !engine || !P.travelFilters || !filters?.destinations || typeof P.resolveCountry !== "function") throw new Error("Load Blocks 1A, 1C, 3, 3A and 4 before Block 4A.");
    const number = new Intl.NumberFormat("en-GB"), unknownCountry = "Unknown destination";
    let pending = null, offers = [], visible = [], facets = new Map(), sort = "best-value", frame = 0, weatherTimer = 0;

    // Build the destinations sidebar and results toolbar.
    function node(tag, className = "", text = "") { const element = document.createElement(tag); element.className = className; element.textContent = text; return element; }
    function button(text, pressed, click) {
        const element = node("button", "", text);
        element.type = "button";
        if (pressed !== null) element.setAttribute("aria-pressed", String(pressed));
        element.addEventListener("click", click);
        return element;
    }
    const root = node("section"), sidebar = node("aside", "psx-panel psx-sidebar"), main = node("div", "psx-layout"), results = node("section", "psx-results");
    const header = node("div", "psx-results-head"), title = node("div", "psx-results-title"), count = node("span", "psx-results-status"), sortHost = node("div", "psx-options"), cards = node("div");
    const sortTools = node("div", "psx-sort-tools"), datesLabel = node("label", "psx-hide-dates"), hideDates = node("input");
    const resortLabel = node("label", "psx-resort-required"), requireResort = node("input");
    const drawer = button("Destinations", null, () => setDrawer(true)), close = button("Close", null, () => setDrawer(false)), backdrop = button("", null, () => setDrawer(false));
    root.id = "psHolidayExplorer";
    root.hidden = true;
    sidebar.id = "psExplorerDestinations";
    cards.id = "psHolidayOffers";
    drawer.className = "psx-drawer-toggle";
    drawer.setAttribute("aria-controls", sidebar.id);
    drawer.setAttribute("aria-expanded", "false");
    close.className = "psx-drawer-close";
    backdrop.className = "psx-drawer-backdrop";
    backdrop.tabIndex = -1;
    backdrop.setAttribute("aria-label", "Close destinations");
    count.setAttribute("role", "status");
    title.append(node("h2", "", "Best holiday deals"), count);
    hideDates.type = "checkbox";
    hideDates.id = "psHideOtherDates";
    hideDates.setAttribute("aria-controls", cards.id);
    datesLabel.append(hideDates, "Hide other dates");
    requireResort.type = "checkbox";
    requireResort.disabled = typeof engine.hasResortComparison !== "function";
    resortLabel.title = requireResort.disabled ? "Load the updated Block 1C to use this filter." : "Show only offers with at least one matched resort peer.";
    resortLabel.append(requireResort, "Require resort comparison");
    requireResort.addEventListener("change", schedule);
    sortTools.append(datesLabel, resortLabel, sortHost);
    header.append(title, sortTools);
    results.append(header, cards);
    main.append(drawer, results);
    sidebar.append(close);
    root.append(sidebar, main, backdrop);
    consoleRoot.after(root);
    const destinations = filters.destinations({host: sidebar, change: schedule});
    const best = button("Best value", true, () => { sort = "best-value"; schedule(); }), lowest = button("Lowest price", false, () => { sort = "lowest-price"; schedule(); });
    sortHost.setAttribute("role", "group");
    sortHost.setAttribute("aria-label", "Sort offers");
    sortHost.append(best, lowest);

    // Size both columns to the viewport space below the Search Console.
    const viewport = window.visualViewport;
    function fitResults() {
        if (root.hidden || !root.getClientRects().length) return;
        const bottom = viewport ? viewport.offsetTop + viewport.height : document.documentElement.clientHeight;
        const height = Math.max(240, Math.floor(bottom - root.getBoundingClientRect().top - 12));
        root.style.setProperty("--psx-available-height", `${height}px`);
    }
    if (typeof ResizeObserver === "function") new ResizeObserver(fitResults).observe(consoleRoot);
    window.addEventListener("resize", fitResults);
    viewport?.addEventListener("resize", fitResults);

    // Keep the mobile destinations drawer independent of filtering.
    function setDrawer(open, restoreFocus = true) {
        root.classList.toggle("is-drawer-open", open);
        drawer.setAttribute("aria-expanded", String(open));
        if (open) close.focus(); else if (restoreFocus) drawer.focus();
    }
    root.addEventListener("keydown", event => { if (event.key === "Escape" && root.classList.contains("is-drawer-open")) setDrawer(false); });
    matchMedia("(max-width:760px)").addEventListener("change", event => { if (!event.matches) setDrawer(false, false); });

    // Apply travel and destination filters and group by canonical country code.
    function schedule() { if (offers.length && !frame) frame = requestAnimationFrame(refresh); }
    function priceAt(index) { return offers[index]?.pricePerPersonPence ?? Infinity; }
    function byPrice(a, b) { return priceAt(a) - priceAt(b) || a - b; }
    function refresh() {
        frame = 0;
        if (!offers.length || !engine.isReady(offers)) { hide(); return; }
        const next = [], countries = new Map(), resortRequired = requireResort.checked && !requireResort.disabled;
        for (let i = 0; i < offers.length; i++) {
            const offer = offers[i];
            if (!P.travelFilters.matches(offer) || !destinations.matchesOffer(offer)) continue;
            if (resortRequired && !engine.hasResortComparison(i)) continue;
            const resolved = P.resolveCountry(offer.countryCode) || P.resolveCountry(offer.country);
            const countryCode = resolved?.countryCode ?? null, key = countryCode ?? unknownCountry, price = priceAt(i);
            let stats = countries.get(key);
            if (!stats) { stats = {country: resolved?.country ?? unknownCountry, countryCode, count: 0, min: null}; countries.set(key, stats); }
            stats.count++;
            if (Number.isFinite(price) && (stats.min === null || price < stats.min)) stats.min = price;
            if (destinations.matches(key)) next.push(i);
        }
        if (sort === "best-value") {
            const rank = engine.getRankByIndex || engine.getRank;
            next.sort((a, b) => (rank(b) ?? -Infinity) - (rank(a) ?? -Infinity) || byPrice(a, b));
        } else next.sort(byPrice);
        visible = next;
        facets = countries;
        root.hidden = false;
        destinations.update(facets);
        best.setAttribute("aria-pressed", String(sort === "best-value"));
        lowest.setAttribute("aria-pressed", String(sort === "lowest-price"));
        count.textContent = `${number.format(visible.length)} ${visible.length === 1 ? "offer" : "offers"}`;
        fitResults();
        publish();
    }
    function publish() { root.dispatchEvent(new CustomEvent("package-scout:explorer-updated", {bubbles: true, detail: {offers, indices: visible, sort, host: cards}})); }
    consoleRoot.addEventListener("package-scout:filters-submit", event => {
        queueMicrotask(() => { if (!event.defaultPrevented && event.detail?.reuseOffers) schedule(); });
    });

    // Hide results while crawling or comparing and reset live filters for new offers.
    function hide() {
        if (frame) { cancelAnimationFrame(frame); frame = 0; }
        if (weatherTimer) { clearTimeout(weatherTimer); weatherTimer = 0; }
        const hadOffers = offers.length > 0;
        root.hidden = true;
        setDrawer(false, false);
        offers = [];
        visible = [];
        facets = new Map();
        if (hadOffers) { publish(); cards.replaceChildren(); }
    }
    function activate(next) {
        if (next !== pending || !next.length || !engine.isReady(next)) return;
        pending = null;
        offers = next;
        destinations.reset();
        requireResort.checked = false;
        sort = "best-value";
        schedule();
    }

    // Accept readiness and errors only for the dataset currently waiting.
    P.holidayExplorer = {refresh: schedule, getOffers: () => offers, getVisibleIndices: () => visible, getCountries: () => facets, getSort: () => sort, host: cards};
    document.addEventListener("package-scout:search-start", () => { pending = null; hide(); });
    document.addEventListener("package-scout:search-complete", event => {
        const next = event.detail?.offers;
        if (!Array.isArray(next)) return;
        pending = next.length ? next : null;
        hide();
        if (pending) activate(next);
    });
    document.addEventListener("package-scout:comparison-ready", event => { if (pending && event.detail?.offers === pending) activate(pending); });
    document.addEventListener("package-scout:comparison-error", event => { if (pending && event.detail?.offers === pending) { pending = null; hide(); } });

    // Refresh results when weather arrives while the mobile sidebar is closed.
    document.addEventListener("package-scout:weather-cache-updated", () => {
        if (!offers.length || weatherTimer || sidebar.getClientRects().length) return;
        const temperature = sidebar.querySelector(".psx-dest-limits label:last-child input");
        if (!temperature?.value) return;
        weatherTimer = setTimeout(() => { weatherTimer = 0; schedule(); }, 400);
    });
})();
</script>

.ps-offer-dialog header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.ps-offer-dialog img{display:block;max-width:100%;max-height:76vh;object-fit:contain;border-radius:8px}
@container ps-cards (min-width:1001px){
    #psHolidayOffers .ps-offer-weather,#psHolidayOffers .ps-offer-comparisons{padding-left:8px;border-left:1px solid #e2e7ea}
}
@container ps-cards (max-width:1000px){
    #psHolidayOffers .ps-card-scroll{--ps-lead-height:218px}
    #psHolidayOffers .ps-offer-lead{grid-template-columns:minmax(0,30%) minmax(0,1fr) minmax(0,18%);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"photos info price" "photos comparison weather"}
    #psHolidayOffers .ps-offer-comparisons{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@container ps-cards (max-width:650px){
    #psHolidayOffers .ps-card-scroll{--ps-lead-height:265px}
    #psHolidayOffers .ps-offer-lead{grid-template-columns:minmax(0,27%) minmax(0,1fr) minmax(76px,22%);gap:6px}
    #psHolidayOffers .ps-offer-price{padding-left:5px}
    #psHolidayOffers .ps-offer-price strong{font-size:21px}
    #psHolidayOffers .ps-offer-link{gap:3px;padding-inline:4px;font-size:11px}
    #psHolidayOffers .ps-offer-link svg{width:11px;height:11px}
    #psHolidayOffers .ps-offer-benchmark{grid-template-columns:minmax(0,1fr)}
    #psHolidayOffers .ps-offer-benchmark strong{justify-self:start}
}
@container ps-cards (max-width:400px){
    #psHolidayOffers .ps-card-scroll{--ps-lead-height:285px}
    #psHolidayOffers .ps-offer-title strong{font-size:14px}
    #psHolidayOffers .ps-offer-meta{font-size:11px}
    #psHolidayOffers .ps-offer-benchmark-title span{overflow-wrap:anywhere}
}
</style>
<script>
(() => {
    "use strict";
    const P = window.PACKAGE_SCOUT, explorer = P?.holidayExplorer, host = explorer?.host, engine = P?.comparisonEngine;
    if (P?.holidayCards) return;
    if (!host || !engine) throw new Error("Load the comparison engine and Explorer shell before Block 5.");
    const number = new Intl.NumberFormat("en-GB"), currency = new Intl.NumberFormat("en-GB", {style: "currency", currency: "GBP", maximumFractionDigits: 0});
    const deltaCurrency = new Intl.NumberFormat("en-GB", {style: "currency", currency: "GBP", minimumFractionDigits: 0, maximumFractionDigits: 2});
    const dateFormat = new Intl.DateTimeFormat("en-GB", {weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC"});
    const monthFormat = new Intl.DateTimeFormat("en-GB", {month: "short", timeZone: "UTC"});
    const airportCodes = new Map([["heathrow", "LHR"], ["gatwick", "LGW"], ["manchester", "MAN"], ["stansted", "STN"], ["luton", "LTN"], ["birmingham", "BHX"], ["bristol", "BRS"]]);
    const ns = "http://www.w3.org/2000/svg", overscan = 2, maxScrollHeight = 8000000, maxDates = 5;
    const imageBase = "https://img.icetravelgroup.com", imageParams = {format: "auto", quality: "75", width: "600", height: "440"};
    const paths = {pin: "M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z M12 7.5a2.5 2.5 0 1 0 0 5a2.5 2.5 0 1 0 0-5", calendar: "M3 5h18v16H3z M7 3v4 M17 3v4 M3 10h18", plane: "m2 16 20-6-8-3-4-5-2 1 1 6-5 3-3-2z M3 21h18", moon: "M20 15a8.5 8.5 0 0 1-11-11 8.5 8.5 0 1 0 11 11Z", meal: "M4 3v8m4-8v8M4 7h4M6 11v10M16 3v18m0-18c4 2 5 6 5 9h-5", layers: "m12 3 9 5-9 5-9-5z M3 12l9 5 9-5 M3 17l9 5 9-5", external: "M13 4h7v7 M20 4l-9 9 M10 5H5v14h14v-5", image: "M3 3h18v18H3z M3 18l5-5 4 4 4-6 5 7 M8 7h.01", rain: "M6 15a4 4 0 0 1 0-8 6 6 0 0 1 11 2 3 3 0 1 1 1 6H6Z M8 18l-1 3 M13 18l-1 3 M18 18l-1 3", warning: "M12 3 2 20h20L12 3Z M12 9v5m0 3h.01"};
    const mounted = new Map();
    let source = [], indices = [], hotels = [], offsets = new Float64Array(1), sort = "", layout = "", gap = 0, trackHeight = 0, frame = 0, updates = 0, firstMounted = -1, endMounted = -1;
    let hideOtherDates = Boolean(document.getElementById("psHideOtherDates")?.checked);

    // Format offer details and use the booking handoff from Block 1A.
    function node(tag, className = "", text = "") { const element = document.createElement(tag); element.className = className; element.textContent = text; return element; }
    function svgNode(tag, attributes) { const element = document.createElementNS(ns, tag); for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value)); return element; }
    function icon(name) {

        svg.append(svgNode("path", {d: paths[name]}));
        return svg;
    }
    function safeUrl(value) {
        if (typeof value !== "string" || !value.trim()) return "";
        try { const url = new URL(value); return url.protocol === "https:" && !url.username && !url.password ? url.href : ""; } catch { return ""; }
    }
    function imageUrl(row) {
        const path = typeof row.imagePath === "string" ? row.imagePath.trim() : "";
        const resolved = /^\/?geography\/accommodation\//.test(path) ? new URL(path, imageBase).href : safeUrl(path.startsWith("//") ? `https:${path}` : path);
        if (!resolved) return "";
        const url = new URL(resolved);
        if (url.origin === imageBase && url.pathname.startsWith("/geography/accommodation/")) for (const [key, value] of Object.entries(imageParams)) if (!url.searchParams.has(key)) url.searchParams.set(key, value);

    }
    function setExternalLink(link, url) { link.href = url; link.target = "_blank"; link.rel = "noopener noreferrer"; }
    function offerLink(row) {

        return link;
    }
    function timeOf(value) { return typeof value === "string" && /^\d{4}-\d{2}-\d{2}$/.test(value) ? Date.parse(`${value}T12:00:00Z`) : NaN; }

    function money(value) { return Number.isFinite(value) && value > 0 ? currency.format(Math.ceil(value)) : "—"; }
    function priceOf(row) { return Number.isSafeInteger(row.pricePerPersonPence) && row.pricePerPersonPence > 0 ? row.pricePerPersonPence / 100 : null; }
    function normal(value) { return String(value ?? "").normalize("NFKD").replace(/\p{M}/gu, "").toLowerCase().trim(); }

    function flag(row) {
        const resolved = P.resolveCountry?.(row.countryCode) || P.resolveCountry?.(row.country), code = resolved?.countryCode;
        if (!code || !/^[A-Z]{2}$/.test(code)) return null;
        const image = node("img", "ps-offer-flag"), filename = `${code.toLowerCase()}.svg`;
        image.alt = "";
        image.title = resolved.country;
        image.decoding = "async";
        image.referrerPolicy = "no-referrer";
        image.addEventListener("error", () => {
            image.addEventListener("error", () => image.remove(), {once: true});
            image.src = `https://flagcdn.com/${filename}`;
        }, {once: true});
        image.src = `./flags/${filename}`;
        return image;
    }

    // Match numeric and string IDs, with an exact name-and-location fallback for saved rows.
    function hotelIdKey(value) {

    function hotelLocationKey(row) {

        return `location:${JSON.stringify([name, country, region, resort])}`;
    }

    // Keep one candidate per other departure date, then select by value and display by date.
    function valueOrder(a, b) { return b.rank - a.rank || a.price - b.price || a.index - b.index; }

        for (const index of rankedIndices) {
            const row = offers[index], id = hotelIdKey(row.hotelId);

            const location = hotelLocationKey(row);
            if (!location) continue;

            else if (knownIds.get(location) !== id) knownIds.set(location, null);
        }
        for (const index of rankedIndices) {
            const row = offers[index];
            let key = hotelIdKey(row.hotelId);
            if (!key) {
                const location = hotelLocationKey(row);
                if (location) key = knownIds.has(location) ? knownIds.get(location) : location;
            }
