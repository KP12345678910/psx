            if (!group) {
                group = {lead: index, byDate: null, dates: [], omitted: 0};
                groups.push(group);
                if (key) byHotel.set(key, group);
            }
            if (!Number.isFinite(timeOf(row.departureDate)) || row.departureDate === offers[group.lead].departureDate) continue;
            const rank = engine.getRank(index), dates = group.byDate ||= new Map();
            const candidate = {index, date: row.departureDate, rank: Number.isFinite(rank) ? rank : -Infinity, price: priceOf(row) ?? Infinity};
            const previous = dates.get(candidate.date);
            if (!previous || valueOrder(candidate, previous) < 0) dates.set(candidate.date, candidate);
        }
        for (const group of groups) {
            if (!group.byDate) continue;
            group.omitted = Math.max(0, group.byDate.size - maxDates);
            group.dates = [...group.byDate.values()].sort(valueOrder).slice(0, maxDates).sort((a, b) => a.date.localeCompare(b.date));
            group.byDate = null;
        }
        return groups;
    }

    // Load photos for visible cards and release the enlarged image on close.
    const dialog = node("dialog", "ps-offer-dialog"), dialogHead = node("header"), caption = node("strong"), close = node("button", "", "Close"), enlarged = node("img"), imageMessage = node("p");
    caption.id = "psOfferPhotoCaption";
    dialog.setAttribute("aria-labelledby", caption.id);
    close.type = "button";
    close.autofocus = true;
    dialogHead.append(caption, close);
    dialog.append(dialogHead, enlarged, imageMessage);
    document.body.append(dialog);
    function showPhoto(loaded) { enlarged.hidden = !loaded; imageMessage.hidden = loaded; if (!loaded) imageMessage.textContent = "Photo unavailable."; }
    function openPhoto(row) {
        const url = imageUrl(row);
        if (!url) return;
        caption.textContent = row.hotelName || "Hotel photo";
        enlarged.alt = caption.textContent;
        enlarged.hidden = true;
        imageMessage.hidden = false;
        imageMessage.textContent = "Loading photo…";
        if (!dialog.open) dialog.showModal();
        enlarged.src = url;
        if (enlarged.complete && enlarged.naturalWidth) showPhoto(true);
    }
    close.addEventListener("click", () => dialog.close());
    dialog.addEventListener("close", () => { if (!dialog.open) enlarged.removeAttribute("src"); });
    dialog.addEventListener("click", event => {
        if (event.target !== dialog) return;
        const rect = dialog.getBoundingClientRect();
        if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) dialog.close();
    });
    enlarged.addEventListener("load", () => { if (dialog.open) showPhoto(true); });
    enlarged.addEventListener("error", () => { if (dialog.open) showPhoto(false); });
    function photos(row) {
        const box = node("div", "ps-offer-photos"), placeholder = node("div", "ps-offer-no-photo"), url = imageUrl(row);
        placeholder.append(icon("image"), "Photo unavailable");
        box.append(placeholder);
        if (!url) return box;
        placeholder.hidden = true;
        const button = node("button", "ps-offer-photo"), image = node("img");
        button.type = "button";
        button.setAttribute("aria-label", `Enlarge photo of ${row.hotelName || "this hotel"}`);
        image.alt = row.hotelName || "Hotel photo";
        image.loading = "lazy";
        image.decoding = "async";
        image.addEventListener("error", () => { button.remove(); placeholder.hidden = false; }, {once: true});
        button.addEventListener("click", () => openPhoto(row));
        button.append(image);
        box.append(button);
        image.src = url;
        return box;
    }

    // Refresh weather and FCDO advice for mounted cards.
    function paintWeather(box, weather, row, compact) {
        const high = weather?.highC, rain = weather?.rainfallMm, key = `${high}|${rain}|${weather?.source}|${weather?.period}|${weather?.matchLevel}`;
        if (box.dataset.weatherKey === key) return;
        box.dataset.weatherKey = key;
        box.replaceChildren();
        box.removeAttribute("title");
        if (Number.isFinite(high)) {
            const main = node("span", "ps-offer-weather-main"), sun = node("span", "ps-offer-weather-glyph", "☀");
            sun.setAttribute("aria-hidden", "true");
            main.append(sun, node("strong", compact ? "" : "ps-offer-weather-temp", `${Math.round(high)}°C`));
            box.append(main);
            if (!compact) box.append(node("span", "ps-offer-weather-note", `${formatDate(row.departureDate, monthFormat)} avg high`));
        }
        if (Number.isFinite(rain)) {
            const line = node("span", "ps-offer-rain");
            line.append(icon("rain"), node("span", "", `${Math.round(rain)} mm`));
            line.title = "Average monthly rainfall";
            box.append(line);
        }
        if (box.childElementCount) box.title = [weather?.source || "Historical weather", weather?.period, weather?.matchLevel].filter(Boolean).join(" · ");
        else box.append(node("span", "ps-offer-weather-note", compact ? "—" : "Weather unavailable"));
    }
    function updateWeather(card) {
        paintWeather(card.weather, P.weatherFor?.(card.row), card.row, false);
        if (hideOtherDates) return;
        for (const {row, cell} of card.dateWeather) paintWeather(cell, P.weatherFor?.(row), row, true);
    }
    function updateAdvice(card) {
        const advice = P.travelAdvice?.peek(card.row.country), url = safeUrl(advice?.url), existing = card.price.querySelector(".ps-x-card-advice");
        if (!advice?.isWarning || !url.startsWith("https://www.gov.uk/foreign-travel-advice/")) { existing?.remove(); return; }
        const labels = {all: "Avoid all travel", essential: "Essential travel only", mixed: "Regional warnings"};
        const label = labels[advice.status] || "Travel advice", link = existing || node("a", "ps-x-card-advice");
        link.replaceChildren(icon("warning"), label);
        link.classList.toggle("is-severe", ["all", "essential", "mixed"].includes(advice.status));
        setExternalLink(link, url);
        link.title = advice.tooltip || advice.label || label;
        link.setAttribute("aria-label", `FCDO travel advice for ${card.row.country}: ${advice.label || label}`);
        if (!existing) card.price.append(link);
    }

    // Compare each deal using its original offer index.
    function comparison(index, type) {
        const view = engine.getView(index, type);
        if (!(view?.externalCount > 0 && Number.isFinite(view.discountPct) && Number.isFinite(view.median))) return null;
        const magnitude = Math.round(Math.abs(view.discountPct));
        return {view, pct: magnitude === 0 ? "0%" : `${view.discountPct > 0 ? "−" : "+"}${magnitude}%`};
    }
    function benchmark(index, type) {
        const match = comparison(index, type), view = match?.view;
        const box = node("div", `ps-offer-benchmark${!match ? " is-missing" : view.discountPct < 0 ? " is-higher" : ""}`), title = node("div", "ps-offer-benchmark-title");
        title.append(icon(type === "resort" ? "pin" : "layers"), node("span", "", `Vs ${type} median`));
        const unavailable = type === "region" && !normal(source[index]?.region) ? "Region unknown" : "No matched offers";
        const message = match ? `${number.format(view.externalCount)} matched ${view.externalCount === 1 ? "offer" : "offers"}` : unavailable;
        box.append(title, node("strong", "", match?.pct ?? "—"), node("small", "", message));
        if (match) box.title = `${source[index][type] || type} median ${money(view.median)} pp · ${number.format(view.externalCount)} other matches · median includes this offer`;
        return box;
    }
    function timelineComparison(index, type) {
        const match = comparison(index, type), discount = match?.view.discountPct;
        const item = node("span", "ps-date-comparison", `Vs ${type}`);
        item.append(node("strong", discount > 0 ? "is-lower" : discount < 0 ? "is-higher" : "", match?.pct ?? "—"));
        const unavailable = type === "region" && !normal(source[index]?.region) ? "Region unknown" : `No ${type} comparison`;
        item.title = match ? `${type === "region" ? "Region" : "Resort"} median ${money(match.view.median)} pp · ${number.format(match.view.externalCount)} other matches` : unavailable;
        return item;
    }
    function timelinePrice(row, lead) {
        const box = node("div", "ps-date-price"), price = priceOf(row), url = safeUrl(row.bookingUrl);
        const amount = node(url ? "a" : "strong", "", money(price));
        if (url) {
            setExternalLink(amount, url);
            amount.setAttribute("aria-label", `View ${formatDate(row.departureDate)} offer, ${money(price)} per person`);
        }
        box.append(node("span", "", "Price pp"), amount);
        if (price !== null && priceOf(lead) !== null) {
            const difference = row.pricePerPersonPence - lead.pricePerPersonPence;
            const sign = difference > 0 ? "+" : difference < 0 ? "−" : "";
            const delta = node("span", `ps-date-delta${difference > 0 ? " is-higher" : difference < 0 ? " is-lower" : ""}`, `${sign}${deltaCurrency.format(Math.abs(difference) / 100)}`);
            delta.title = "Price difference per person versus the featured offer";
            box.append(delta);
        }
        return box;
    }

    // Render the muted timeline below the featured offer.
    function datesTimeline(group, card) {
        const section = node("section", "ps-date-timeline"), heading = node("div", "ps-date-heading");
        const wrapper = node("div", "ps-date-scroll"), stops = node("ol", "ps-date-stops");
        section.setAttribute("aria-label", `Other dates for ${card.row.hotelName || "this hotel"}`);
        heading.append(node("strong", "", "Other dates"));
        if (group.omitted) heading.append(node("small", "", `+ ${number.format(group.omitted)} more ${group.omitted === 1 ? "date" : "dates"} not shown`));
        wrapper.tabIndex = 0;
        wrapper.setAttribute("role", "region");
        wrapper.setAttribute("aria-label", "Alternative departure timeline");
        for (const {index} of group.dates) {
            const row = source[index], stop = node("li", "ps-date-stop"), label = node("div", "ps-date-stop-label"), airport = node("span", "ps-date-airport");
            const weather = node("div", "ps-date-weather"), marker = node("span", "ps-date-marker"), comparisons = node("div", "ps-date-comparisons");
            const date = node("time", "", formatDate(row.departureDate));
            date.dateTime = row.departureDate;
            airport.append(icon("plane"), node("span", "", airportLabel(row.departureAirport)));
            airport.title = row.departureAirport || "Departure airport unavailable";
            label.append(date, airport);
            marker.setAttribute("aria-hidden", "true");
            comparisons.append(timelineComparison(index, "region"), timelineComparison(index, "resort"));
            stop.append(label, weather, marker, comparisons, timelinePrice(row, card.row));
            stops.append(stop);
            card.dateWeather.push({row, cell: weather});
        }
        wrapper.append(stops);
        section.append(heading, wrapper);
        return section;
    }
    function makeCard(position) {
        const group = hotels[position], index = group.lead, row = source[index];
        const element = node("article", "ps-offer-card"), lead = node("div", "ps-offer-lead"), picture = photos(row), info = node("div", "ps-offer-info"), title = node("div", "ps-offer-title");
        const countryFlag = flag(row), rating = Number(row.starRating);
        if (countryFlag) title.append(countryFlag);
        title.append(node("strong", "", row.hotelName || "Unnamed hotel"));
        if (rating > 0 && rating <= 5) {
            const stars = node("span", "ps-offer-stars", Number.isInteger(rating) ? "★".repeat(rating) : `${rating}★`);
            stars.setAttribute("aria-label", `${rating} stars`);
            title.append(stars);
        }
        info.append(title);
        const score = row.reviewScore, count = row.reviewCount;
        if (Number.isFinite(score) && score > 0 && score <= 10) {
            const review = node("div", "ps-offer-review"), label = Number.isSafeInteger(count) && count > 0 ? `${number.format(count)} guest ${count === 1 ? "review" : "reviews"}` : "Guest rating";
            review.append(node("strong", "", `${number.format(score)}/10`), node("span", "", label));
            info.append(review);
        }
        const places = [...new Map([row.resort, row.region, row.country].filter(Boolean).map(place => [normal(place), place])).values()];
        const details = node("div", "ps-offer-details"), trip = node("div", "ps-offer-details");
        for (const [target, symbol, value] of [[details, "pin", places.join(", ") || "Location unavailable"], [details, "moon", row.nights ? `${row.nights} ${row.nights === 1 ? "night" : "nights"}` : ""], [details, "meal", row.board || "Board unavailable"], [trip, "plane", airportLabel(row.departureAirport)], [trip, "calendar", formatDate(row.departureDate)]]) {
            if (!value) continue;
            const line = node("div", "ps-offer-meta"), label = node("span", "", value);
            label.title = symbol === "plane" ? row.departureAirport || value : value;
            line.append(icon(symbol), label);
            target.append(line);
        }
        info.append(details, trip);
        if (position === 0 && sort === "best-value" && (engine.getRank(index) ?? 0) > 0) picture.append(node("span", "ps-offer-top-badge", "◎ Top value"));
        const weather = node("div", "ps-offer-weather"), comparisons = node("div", "ps-offer-comparisons"), price = node("div", "ps-offer-price"), amount = node("div", "ps-price-amount");
        amount.append(node("strong", "", money(priceOf(row))), node("small", "", "pp"));
        price.append(node("small", "", "from"), amount, offerLink(row));
        const card = {row, element, weather, price, dateWeather: [], timeline: null};
        comparisons.append(benchmark(index, "region"), benchmark(index, "resort"));
        lead.append(picture, info, weather, comparisons, price);
        element.append(lead);
        if (group.dates.length) {
            card.timeline = datesTimeline(group, card);
            card.timeline.hidden = hideOtherDates;
            element.classList.toggle("has-dates", !hideOtherDates);
            element.append(card.timeline);
        }
        updateWeather(card);
        updateAdvice(card);
        return card;
    }

    // Virtualise the cards and preserve the scroll anchor when their heights change.
    const scroll = node("div", "ps-card-scroll"), track = node("div", "ps-card-track"), windowNode = node("div", "ps-card-window");
    scroll.tabIndex = 0;
    scroll.setAttribute("role", "region");
    scroll.setAttribute("aria-label", "Holiday offers");
    track.append(windowNode);
    scroll.append(track);
    function logicalMax() { return Math.max(0, offsets[hotels.length] - gap - scroll.clientHeight); }
    function physicalMax() { return Math.max(0, trackHeight - scroll.clientHeight); }
    function logicalTop() { const max = physicalMax(); return max ? Math.min(max, Math.max(0, scroll.scrollTop)) / max * logicalMax() : 0; }
    function positionAt(top) {
        let left = 0, right = hotels.length;
        while (left < right) { const mid = Math.floor((left + right) / 2); if (offsets[mid + 1] <= top) left = mid + 1; else right = mid; }
        return Math.min(left, hotels.length - 1);
    }
    function queueWindow() { if (!frame && hotels.length) frame = requestAnimationFrame(drawWindow); }
    function removeCard(position, card) {
        if (card.element.contains(document.activeElement)) scroll.focus({preventScroll: true});
        card.element.querySelector(".ps-offer-photo img")?.removeAttribute("src");
        card.element.remove();
        mounted.delete(position);
    }
    function measureLayout() {
        const styles = getComputedStyle(scroll);
        const dimensions = ["--ps-lead-height", "--ps-timeline-height", "--ps-card-gap", "--ps-timeline-gap", "--ps-card-padding", "--ps-card-border"].map(name => parseFloat(styles.getPropertyValue(name)));
        const nextLayout = `${dimensions.join("/")}/${scroll.clientWidth}/${hideOtherDates}`;
        if (nextLayout === layout) return;
        const oldTop = layout ? logicalTop() : 0, anchor = layout ? positionAt(oldTop) : 0, within = oldTop - offsets[anchor];
        const [lead, timeline, nextGap, timelineGap, padding, border] = dimensions;
        layout = nextLayout;
        gap = nextGap;
        const baseHeight = lead + 2 * (padding + border);
        for (let i = 0; i < hotels.length; i++) {
            const showTimeline = !hideOtherDates && hotels[i].dates.length > 0;
            offsets[i + 1] = offsets[i] + baseHeight + (showTimeline ? timeline + timelineGap : 0) + gap;
        }
        trackHeight = Math.min(maxScrollHeight, offsets[hotels.length] - gap);
        track.style.height = `${trackHeight}px`;
        const limit = logicalMax(), anchorTop = offsets[anchor] + Math.min(within, offsets[anchor + 1] - offsets[anchor] - 1);
        scroll.scrollTop = limit ? Math.min(1, Math.max(0, anchorTop) / limit) * physicalMax() : 0;
    }
    function drawWindow() {
        frame = 0;
        if (!hotels.length || !scroll.isConnected || !scroll.clientHeight) return;
        measureLayout();
        const top = logicalTop(), first = Math.max(0, positionAt(top) - overscan), end = Math.min(hotels.length, positionAt(top + scroll.clientHeight) + 1 + overscan);
        windowNode.style.transform = `translateY(${scroll.scrollTop - top + offsets[first]}px)`;
        if (first === firstMounted && end === endMounted) return;
        firstMounted = first;
        endMounted = end;
        for (const [position, card] of mounted) if (position < first || position >= end) removeCard(position, card);
        let before = windowNode.firstChild;
        for (let position = first; position < end; position++) {
            let card = mounted.get(position);
            if (!card) { card = makeCard(position); mounted.set(position, card); windowNode.insertBefore(card.element, before); }
            before = card.element.nextSibling;
        }
    }
    scroll.addEventListener("scroll", queueWindow, {passive: true});
    scroll.addEventListener("wheel", event => {
        const actual = physicalMax(), logical = logicalMax();
        if (event.ctrlKey || event.shiftKey || !actual || logical <= actual || !event.deltaY || Math.abs(event.deltaX) > Math.abs(event.deltaY)) return;
        event.preventDefault();
        const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? scroll.clientHeight : 1;
        scroll.scrollTop += event.deltaY * unit * actual / logical;
    }, {passive: false});
    scroll.addEventListener("keydown", event => {
        if (event.target !== scroll || event.altKey || event.ctrlKey || event.metaKey) return;
        const actual = physicalMax(), logical = logicalMax();
        if (!actual || logical <= actual) return;
        const delta = {ArrowUp: -40, ArrowDown: 40, PageUp: -scroll.clientHeight, PageDown: scroll.clientHeight, " ": (event.shiftKey ? -1 : 1) * scroll.clientHeight}[event.key];
        if (delta === undefined) return;
        event.preventDefault();
        scroll.scrollTop += delta * actual / logical;
    });
    if (typeof ResizeObserver === "function") new ResizeObserver(queueWindow).observe(scroll);
    else window.addEventListener("resize", queueWindow);

    // Collapse or restore timelines without changing the grouped results.
    function setHideOtherDates(hidden) {
        const next = Boolean(hidden);
        if (next === hideOtherDates) return;
        hideOtherDates = next;
        for (const card of mounted.values()) {
            if (!card.timeline) continue;
            card.timeline.hidden = next;
            card.element.classList.toggle("has-dates", !next);
            if (!next) updateWeather(card);
        }
        queueWindow();
    }
    document.addEventListener("change", event => {
        if (event.target.id === "psHideOtherDates") setHideOtherDates(event.target.checked);
    });

    // Regroup when the explorer publishes new ranked results.
    function render(nextOffers, nextIndices, nextSort) {
        if (nextOffers.length && !engine.isReady(nextOffers)) { nextOffers = []; nextIndices = []; }
        if (source === nextOffers && sort === nextSort && (indices === nextIndices || (indices.length === nextIndices.length && indices.every((index, position) => index === nextIndices[position])))) return;
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        if (dialog.open) dialog.close();
        for (const [position, card] of mounted) removeCard(position, card);
        source = nextOffers;
        indices = nextIndices;
        sort = nextSort;
        hotels = groupHotels(source, indices);
        offsets = new Float64Array(hotels.length + 1);
        layout = "";
        gap = trackHeight = 0;
        firstMounted = endMounted = -1;
        windowNode.style.transform = "";
        track.style.height = "0px";
        scroll.scrollTop = 0;
        if (!source.length) { host.replaceChildren(); return; }
        if (!hotels.length) { host.replaceChildren(node("div", "ps-offer-empty", "No offers match the selected filters.")); return; }
        if (!scroll.isConnected) host.replaceChildren(scroll);
        queueWindow();
    }
    function scheduleUpdate(mask) {
        if (!mounted.size) return;
        if (!updates) requestAnimationFrame(() => {
            const flags = updates;
            updates = 0;
            for (const card of mounted.values()) { if (flags & 1) updateWeather(card); if (flags & 2) updateAdvice(card); }
        });
        updates |= mask;
    }

    // Follow the explorer's visibility and subscribe to weather and advice updates.
    document.addEventListener("package-scout:explorer-updated", event => {
        const data = event.detail;
        if (data?.host === host && Array.isArray(data.offers) && Array.isArray(data.indices)) render(data.offers, data.indices, data.sort);
    });
    document.addEventListener("package-scout:weather-cache-updated", () => scheduleUpdate(1));
    document.addEventListener("package-scout:travel-advice-changed", () => scheduleUpdate(2));
    P.holidayCards = {render, openPhoto, setHideOtherDates, getHotelCount: () => hotels.length};
    render(explorer.getOffers(), explorer.getVisibleIndices(), explorer.getSort());
})();
</script>

<!-- [TEMPORARY OFFERS STORAGE] - manually save, load and clear offers using local IndexedDB -->
<script>
(() => {
    "use strict";
    const showControls = false;
    if (!showControls) return;

    // Mount once the Search Console header is available.
    function mount() {
        if (document.getElementById("psTempOffersActions")) return;
        const P = window.PACKAGE_SCOUT;
        const root = document.getElementById("searchConsole"), form = document.getElementById("searchConsoleBody"), header = document.getElementById("consoleHeader") || document.querySelector(".ps-app-header");
        if (!header || !root || !form || typeof P?.showSearchSummary !== "function") throw new Error("Load temporary offer storage after Block 3 — Search Console.");
        const DB_NAME = "package-scout-temp-offers", STORE = "snapshots", KEY = "latest", VERSION = 2;
        const fmt = count => count.toLocaleString("en-GB");
        const searching = () => form.getAttribute("aria-busy") === "true";
        let current = null, busy = false, statusTimer = null;

        // Add manual storage actions to the app header.
        const css = document.createElement("style");
        css.textContent = `
#psTempOffersActions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto}
#psTempOffersActions button{box-sizing:border-box;min-height:44px;white-space:nowrap;padding:8px 12px;font:inherit;font-size:12px;font-weight:650;color:inherit;background:#fff;border:1px solid var(--line,#d4d9de);border-radius:6px;cursor:pointer}
#psTempOffersActions button:disabled{opacity:.55;cursor:default}
#psTempOffersActions .ps-temp-offers-status{font-size:11px;color:var(--muted,#697077)}
#psTempOffersActions .ps-temp-offers-status:empty{display:none}
@media(max-width:650px){
    #psTempOffersActions{order:3;flex-basis:100%;justify-content:flex-start;margin-left:0}
    #psTempOffersActions button{flex:1 1 auto}
    #psTempOffersActions .ps-temp-offers-status{order:1;flex-basis:100%}
}`;
        document.head.append(css);
        const actions = document.createElement("div"), status = document.createElement("span");
        actions.id = "psTempOffersActions";
        actions.className = "ps-temp-offers-actions";
        status.className = "ps-temp-offers-status";
        status.setAttribute("role", "status");
        const buttons = ["Save Offers", "Load Offers", "Clear Offers"].map(label => {
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = label;
            return button;
        });
        const [save, load, clear] = buttons;
        actions.append(status, ...buttons);
        header.append(actions);

        // Track the current clean offer rows by reference.
        document.addEventListener("package-scout:search-complete", event => {
            const { offers, config } = event.detail ?? {};
            if (Array.isArray(offers)) current = config ? { offers, config } : null;
        });

        // Open IndexedDB only for a manual save or load.
        function openDB() {
            return new Promise((resolve, reject) => {
                if (!window.indexedDB) { reject(new Error("IndexedDB is unavailable.")); return; }
                const request = indexedDB.open(DB_NAME, 1);
                let blocked = false;
                request.onupgradeneeded = () => request.result.createObjectStore(STORE);
                request.onsuccess = () => {
                    const db = request.result;
                    if (blocked) { db.close(); return; }
                    db.onversionchange = () => db.close();
                    resolve(db);
                };
                request.onerror = () => reject(request.error || new Error("Cannot open the offers database."));
                request.onblocked = () => { blocked = true; reject(new Error("The offers database is blocked by another tab.")); };
            });
        }
        async function snapshot(mode, value) {
            const db = await openDB();
            try {
                return await new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE, mode), store = tx.objectStore(STORE);
                    const request = mode === "readwrite" ? store.put(value, KEY) : store.get(KEY);
                    tx.oncomplete = () => resolve(request.result);
                    tx.onabort = () => reject(tx.error || new Error("The offers storage transaction failed."));
                });
            } finally { db.close(); }
        }

        // Publish saved or cleared offers through the Search Console.
        function publish(offers, config) {
            P.showSearchSummary({ offers, config });
            root.dispatchEvent(new CustomEvent("package-scout:search-complete", { bubbles: true, detail: { offers, config } }));
        }

        // Show brief feedback for completed actions and keep errors visible.
        function feedback(message, temporary = false) {
            clearTimeout(statusTimer);
            status.textContent = message;
            if (temporary) statusTimer = setTimeout(() => { status.textContent = ""; }, 4000);
        }
        async function run(button, label, action) {
            if (busy) return;
            if (searching()) { feedback("Wait for the current search to finish."); return; }
            busy = true;
            for (const item of buttons) item.disabled = true;
            const original = button.textContent;
            button.textContent = label;
            feedback("");
            try {
                const result = await action();
                if (result) feedback(result);
            } catch (error) { feedback(error?.message || "Storage action failed."); }
            finally {
                button.textContent = original;
                for (const item of buttons) item.disabled = false;
                busy = false;
            }
        }

        // Save one flat snapshot and restore it through the completion event.
        save.addEventListener("click", () => run(save, "Saving…", async () => {
            if (!current?.offers.length) return "No offers to save.";
            const value = { version: VERSION, savedAt: new Date().toISOString(), offers: current.offers, config: current.config };
            await snapshot("readwrite", value);
            feedback(`Saved ${fmt(value.offers.length)} offers.`, true);
        }));
        load.addEventListener("click", () => run(load, "Loading…", async () => {
            const previous = current;
            const value = await snapshot("readonly");
            if (!value) return "No saved offers found.";
            if (value.version !== VERSION || !Array.isArray(value.offers) || !value.config) return "Saved snapshot uses an older format. Run and save a fresh search.";
            if (searching()) return "Wait for the current search to finish.";
            if (current !== previous) return "A new search completed while loading. Click Load Offers again to replace it.";
            if (current?.offers.length && !window.confirm(`Replace ${fmt(current.offers.length)} current offers with ${fmt(value.offers.length)} saved offers?`)) return "Load cancelled.";
            publish(value.offers, value.config);
            feedback(`Loaded ${fmt(value.offers.length)} offers.`, true);
        }));

        // Clear the displayed offers and keep the saved snapshot available.
        clear.addEventListener("click", () => run(clear, "Clearing…", async () => {
            if (!current) return "No offers to clear.";
            const count = current.offers.length;
            if (count && !window.confirm(`Clear ${fmt(count)} current offers? Your saved snapshot will remain available.`)) return "Clear cancelled.";
            publish([], null);
            feedback(`Cleared ${fmt(count)} offers. Saved snapshot preserved.`, true);
        }));
    }

    // Allow the storage script to be parsed before Block 3.
    if (document.readyState === "loading" && typeof window.PACKAGE_SCOUT?.showSearchSummary !== "function") document.addEventListener("DOMContentLoaded", mount, { once: true });
    else mount();
})();
</script>
